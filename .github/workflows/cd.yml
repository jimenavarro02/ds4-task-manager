name: CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  e2e:
    name: E2E (Selenium)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t ds4-task-manager:${{ github.sha }} .

      - name: Levantar el contenedor
        run: docker run -d --name app -p 8080:8080 ds4-task-manager:${{ github.sha }}

      - name: Esperar a que la aplicación esté lista
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "Aplicación lista"; exit 0
            fi
            echo "Esperando... ($i)"; sleep 3
          done
          echo "La aplicación no arrancó"; docker logs app; exit 1

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Instalar dependencias de Selenium
        run: pip install -r e2e/requirements.txt

      - name: Ejecutar pruebas E2E (Chrome headless)
        env:
          BASE_URL: http://localhost:8080
          E2E_USER: jimena.navarro
          E2E_PASS: "111111"
        run: python -m pytest e2e -v

      - name: Mostrar logs del contenedor si falló
        if: failure()
        run: docker logs app

      - name: Subir capturas de pantalla de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore

      - name: Detener contenedor
        if: always()
        run: docker rm -f app

  deploy:
    name: Deploy a Render
    needs: e2e
    # Solo cuando se hace merge/push a master, nunca en pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar despliegue en Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Falta el secret RENDER_DEPLOY_HOOK_URL"; exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

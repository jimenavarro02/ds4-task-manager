name: CI/CD Pipeline - TaskFlow

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código fuente del repositorio
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Configurar el entorno de Java (JDK 17)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Compilar y ejecutar pruebas automatizadas con Maven
    - name: Run Build and Tests with Maven
      run: mvn clean test
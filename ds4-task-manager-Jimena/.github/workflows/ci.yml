name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y correr pruebas JUnit
        run: ./mvnw -B verify

      - name: Subir reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: backend/target/site/jacoco/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas
        run: npx ng test --watch=false
      - name: Compilar
        run: npx ng build

        
  e2e:
    name: Pruebas E2E con Selenium y Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Instalar Selenium
        run: python -m pip install -r e2e/requirements.txt

      - name: Construir imagen Docker
        run: docker build -t ds4-task-manager .

      - name: Iniciar aplicación
        run: docker run -d --name task-manager -p 8080:8080 ds4-task-manager

      - name: Esperar a que la aplicación inicie
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "La aplicación está disponible."
              exit 0
            fi
            sleep 2
          done
          echo "La aplicación no inició correctamente."
          docker logs task-manager
          exit 1

      - name: Ejecutar pruebas E2E
        run: python -m unittest discover -s e2e -p "test_*.py" -v

      - name: Mostrar logs si ocurre un error
        if: failure()
        run: docker logs task-manager

      - name: Detener contenedor
        if: always()
        run: docker rm -f task-manager || true
